<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Hızlı Dosya Gönder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
  <div class="max-w-md w-full bg-slate-800 border-2 border-dashed border-slate-600 rounded-3xl p-8 text-center space-y-6">
    
    <!-- Başlık -->
    <h1 class="text-3xl font-extrabold tracking-tight">Dosya Gönder</h1>
    <p class="text-slate-400 text-sm">5 GB'a kadar dosyayı sürükleyin veya seçin.</p>

    <!-- Dosya Seçim Alanı -->
    <input type="file" id="fileInput" class="hidden" />
    <button onclick="document.getElementById('fileInput').click()" 
            class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 rounded-2xl text-xl font-bold transition shadow-lg shadow-indigo-500/30">
      📁 Dosya Seç
    </button>

    <!-- İlerleme Çubuğu (Gizli) -->
    <div id="progressBox" class="hidden space-y-2">
      <div class="w-full bg-slate-700 h-4 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-150"></div>
      </div>
      <p id="progressText" class="text-sm font-semibold">0% Yüklendi...</p>
    </div>

    <!-- Sonuç Linki (Gizli) -->
    <div id="resultBox" class="hidden space-y-3">
      <input type="text" id="shareLink" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-center text-indigo-400 font-mono text-sm" />
      <button onclick="copyLink()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold">
        📋 Linki Kopyala
      </button>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');

    fileInput.onchange = async () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (file.size > 5 * 1024 * 1024 * 1024) {
        alert("Dosya 5 GB'tan büyük olamaz!");
        return;
      }

      // UI Güncelle
      document.getElementById('progressBox').classList.remove('hidden');

      // 1. Sunucudan Yükleme Linki (Presigned URL) Al
      const res = await fetch('/api/get-upload-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: file.name, filetype: file.type })
      });
      const { uploadUrl, fileKey } = await res.json();

      // 2. Doğrudan Buluta Yükle (Progress Takibi İle)
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', uploadUrl, true);
      xhr.setRequestHeader('Content-Type', file.type);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const percent = Math.round((e.loaded / e.total) * 100);
          document.getElementById('progressBar').style.width = percent + '%';
          document.getElementById('progressText').innerText = `%${percent} Yüklendi...`;
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          document.getElementById('progressBox').classList.add('hidden');
          document.getElementById('resultBox').classList.remove('hidden');
          document.getElementById('shareLink').value = `${window.location.origin}/download/${fileKey}`;
        } else {
          alert('Yükleme başarısız oldu.');
        }
      };

      xhr.send(file);
    };

    function copyLink() {
      const copyText = document.getElementById("shareLink");
      navigator.clipboard.writeText(copyText.value);
      alert("Link kopyalandı!");
    }
  </script>
</body>
</html>
